# 路障棋 Quorider —— 一体化部署（应用 + 可选 nginx）
#
#   docker compose up -d --build
#   docker compose logs -f quorider
#   浏览器打开 http://<服务器IP>:3000
#
# 想加 HTTPS / 域名：把 nginx 服务那段取消注释，并把 3000 端口映射去掉，
# 只暴露 nginx 的 80/443，让 nginx 反代到应用（配置见 deploy/nginx.conf）。

services:
  quorider:
    build: .
    image: quorider:latest
    container_name: quorider
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "${QDR_BIND:-0.0.0.0}:${QDR_PORT:-3000}:3000"
    # 房间状态全在内存里，容器不需要任何可写卷
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # ---------------------------------------------------------------
  # 可选：nginx 反向代理（域名 / HTTPS 场景）
  # 启用前先把上面 quorider 的 ports 改成 "127.0.0.1:3000:3000"
