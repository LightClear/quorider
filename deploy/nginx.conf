# 路障棋 Quorider —— nginx 反向代理配置
#
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/quorider
#   sudo ln -s /etc/nginx/sites-available/quorider /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：map 指令只能出现在 http 块里。这里的 map 放在 conf.d 风格的片段开头，
# 如果你把本文件直接 include 进 http 块（sites-enabled 就是这么做的），可以直接用。
# 若 nginx 报 "map directive is not allowed here"，把下面这段 map 挪到 /etc/nginx/nginx.conf 的 http 块内。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream quorider_app {
    # 单机单实例。要多实例需自行加 sticky（WebSocket 无法无状态负载均衡）
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    # 换成你的域名
    server_name quorider.example.com;

    # 上 HTTPS 后把 80 端口整段换成 301 跳转，并复制下面的 location 到 443 server 块：
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/quorider.access.log;
    error_log  /var/log/nginx/quorider.error.log warn;

    # 上传体积：本应用只发小 JSON，收紧一点
    client_max_body_size 64k;
    client_body_timeout 10s;

    # 安全响应头（静态页面无第三方脚本，可以收紧 CSP）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- WebSocket：必须单独放行 Upgrade ----------
    # 规则引擎把 WS 挂在 HTTP server 的 upgrade 事件上，路径任意；前端连的是 /ws。
    location /ws {
        proxy_pass http://quorider_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 服务端每 30s 发一次 ping，读超时必须大于它，否则会被反复掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------- 健康检查 ----------
    location = /healthz {
        proxy_pass http://quorider_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 静态资源 ----------
    # .html 不缓存（保证发版即生效），其余带哈希意识的短缓存
    location ~* \.(?:css|js|mjs|svg|png|ico|woff2)$ {
        proxy_pass http://quorider_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://quorider_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
